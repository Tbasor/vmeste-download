<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" role="img" aria-label="Два кресла кинотеатра, соединённые проводом, подъезжают друг к другу">
  <!-- «Вместе»: two cinema seats far apart, joined by an internet cable; data runs along it and
       the seats glide together. 8 s loop, SMIL only (works as <img>, in WebKit and Chromium). -->
  <defs>
    <linearGradient id="velvet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8323f"/>
      <stop offset="0.55" stop-color="#b3121f"/>
      <stop offset="1" stop-color="#6a0810"/>
    </linearGradient>
    <linearGradient id="cushion" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c41725"/>
      <stop offset="1" stop-color="#5c060d"/>
    </linearGradient>
    <linearGradient id="arm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2a2c"/>
      <stop offset="1" stop-color="#0d0d0e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.15" r="0.75">
      <stop offset="0" stop-color="#ff2a36" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#ff2a36" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ff2a36" stop-opacity="0"/>
    </radialGradient>
    <g id="seat">
      <rect x="-60" y="-138" width="120" height="118" rx="26" fill="url(#velvet)"/>
      <path d="M-30 -126v92M0 -128v94M30 -126v92" stroke="#000" stroke-opacity="0.18" stroke-width="3" stroke-linecap="round"/>
      <rect x="-56" y="-132" width="112" height="22" rx="11" fill="#fff" fill-opacity="0.08"/>
      <rect x="-66" y="-40" width="132" height="40" rx="14" fill="url(#cushion)"/>
      <rect x="-82" y="-70" width="22" height="78" rx="10" fill="url(#arm)"/>
      <rect x="60" y="-70" width="22" height="78" rx="10" fill="url(#arm)"/>
      <rect x="-46" y="0" width="92" height="12" rx="4" fill="#0b0b0c"/>
    </g>
  </defs>


  <g>
    <animate attributeName="opacity" dur="8s" repeatCount="indefinite" keyTimes="0;0.08;0.9;1" values="0;1;1;0"/>

    <!-- warm glow under the pair, brightens when they meet -->
    <ellipse cx="320" cy="236" rx="260" ry="26" fill="url(#glow)">
      <animate attributeName="rx" dur="8s" repeatCount="indefinite" keyTimes="0;0.3;0.62;1" values="280;280;170;170" calcMode="spline" keySplines="0 0 1 1;0.65 0 0.35 1;0 0 1 1"/>
    </ellipse>

    <!-- the internet cable: sags far apart, nearly straight together -->
    <path fill="none" stroke="#3a0a0e" stroke-width="7" stroke-linecap="round" d="M168 214 C 240 258, 400 258, 472 214">
      <animate attributeName="d" dur="8s" repeatCount="indefinite" keyTimes="0;0.3;0.62;1" calcMode="spline" keySplines="0 0 1 1;0.65 0 0.35 1;0 0 1 1"
        values="M168 214 C 240 258, 400 258, 472 214;M168 214 C 240 258, 400 258, 472 214;M298 214 C 308 230, 332 230, 342 214;M298 214 C 308 230, 332 230, 342 214"/>
    </path>
    <!-- data running both ways -->
    <path fill="none" stroke="#ff3b47" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 16" d="M168 214 C 240 258, 400 258, 472 214">
      <animate attributeName="d" dur="8s" repeatCount="indefinite" keyTimes="0;0.3;0.62;1" calcMode="spline" keySplines="0 0 1 1;0.65 0 0.35 1;0 0 1 1"
        values="M168 214 C 240 258, 400 258, 472 214;M168 214 C 240 258, 400 258, 472 214;M298 214 C 308 230, 332 230, 342 214;M298 214 C 308 230, 332 230, 342 214"/>
      <animate attributeName="stroke-dashoffset" dur="0.9s" repeatCount="indefinite" values="0;-18"/>
    </path>
    <path fill="none" stroke="#fff" stroke-opacity="0.7" stroke-width="2" stroke-linecap="round" stroke-dasharray="1 23" d="M168 214 C 240 258, 400 258, 472 214">
      <animate attributeName="d" dur="8s" repeatCount="indefinite" keyTimes="0;0.3;0.62;1" calcMode="spline" keySplines="0 0 1 1;0.65 0 0.35 1;0 0 1 1"
        values="M168 214 C 240 258, 400 258, 472 214;M168 214 C 240 258, 400 258, 472 214;M298 214 C 308 230, 332 230, 342 214;M298 214 C 308 230, 332 230, 342 214"/>
      <animate attributeName="stroke-dashoffset" dur="1.3s" repeatCount="indefinite" values="0;24"/>
    </path>

    <!-- left seat -->
    <g>
      <animateTransform attributeName="transform" type="translate" dur="8s" repeatCount="indefinite" keyTimes="0;0.3;0.62;1"
        calcMode="spline" keySplines="0 0 1 1;0.65 0 0.35 1;0 0 1 1" values="120 214;120 214;250 214;250 214"/>
      <use href="#seat"/>
      <rect x="64" y="-6" width="10" height="10" rx="3" fill="#1c1c1e"/>
    </g>
    <!-- right seat -->
    <g>
      <animateTransform attributeName="transform" type="translate" dur="8s" repeatCount="indefinite" keyTimes="0;0.3;0.62;1"
        calcMode="spline" keySplines="0 0 1 1;0.65 0 0.35 1;0 0 1 1" values="520 214;520 214;390 214;390 214"/>
      <use href="#seat"/>
      <rect x="-74" y="-6" width="10" height="10" rx="3" fill="#1c1c1e"/>
    </g>

    <!-- a little heart when they sit side by side -->
    <g transform="translate(320 56)">
      <path d="M0 14 C -4 9, -16 4, -16 -5 C -16 -12, -10 -16, -5 -16 C -2 -16, 0 -14, 0 -11 C 0 -14, 2 -16, 5 -16 C 10 -16, 16 -12, 16 -5 C 16 4, 4 9, 0 14 Z" fill="#ff2a36">
        <animate attributeName="opacity" dur="8s" repeatCount="indefinite" keyTimes="0;0.62;0.68;0.86;1" values="0;0;1;1;0"/>
        <animateTransform attributeName="transform" type="scale" dur="8s" repeatCount="indefinite" keyTimes="0;0.62;0.68;0.72;0.86;1" values="0.2;0.2;1.25;1;1;1"/>
      </path>
    </g>
  </g>
</svg>
